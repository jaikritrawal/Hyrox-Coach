<style>
/* ---------- design tokens: Apple-style system colours, light and dark ---------- */
/* ---------- v14 theme: friendly light, gradient hero, Inter ---------- */
:root{
  --bg:#F6F7FB;--card:#FFFFFF;--card2:#F1F2F7;--fill:rgba(20,22,40,.06);--fill2:rgba(20,22,40,.12);
  --ink:#14161C;--mut:#737A8C;--faint:#B3B8C6;--line:#E8EAF1;
  --acc:#4D33E6;--acc-s:rgba(77,51,230,.12);--on-acc:#FFFFFF;--g1:#7C5CFF;--g2:#36C2FF;--coral:#FF4D6D;--coral-s:rgba(255,77,109,.12);
  --blue:#4D33E6;--blue-s:rgba(77,51,230,.12);--orange:#FF7A1A;--orange-s:rgba(255,122,26,.14);--mint:#1FB46B;--mint-s:rgba(31,180,107,.13);
  --red:#E5484D;--red-s:rgba(229,72,77,.12);--pink:#FF4D6D;--cyan:#1FB46B;--indigo:#4D33E6;--purple:#4D33E6;
  --on-blue:#FFFFFF;--shadow:0 2px 10px rgba(20,22,40,.05),0 8px 24px -12px rgba(20,22,40,.12);--glass:rgba(255,255,255,.9);--tabink:#8A90A0;--tabon:#4D33E6;
  --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--fc:var(--f);--fr:var(--f);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C10;--card:#15171E;--card2:#1D2029;--fill:rgba(255,255,255,.06);--fill2:rgba(255,255,255,.12);
  --ink:#F2F3F7;--mut:#9AA0B2;--faint:#5A6072;--line:#242733;
  --acc:#7C5CFF;--acc-s:rgba(124,92,255,.18);--on-acc:#FFFFFF;--g1:#7C5CFF;--g2:#36C2FF;--coral:#FF6B86;--coral-s:rgba(255,107,134,.16);
  --blue:#7C5CFF;--blue-s:rgba(124,92,255,.16);--orange:#FF9A4D;--orange-s:rgba(255,154,77,.16);--mint:#3ED88A;--mint-s:rgba(62,216,138,.14);
  --red:#FF6B70;--red-s:rgba(255,107,112,.16);--pink:#FF6B86;--cyan:#3ED88A;--indigo:#7C5CFF;--purple:#7C5CFF;
  --on-blue:#FFFFFF;--shadow:none;--glass:rgba(11,12,16,.92);--tabink:#8A90A0;--tabon:#9D86FF;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0C10;--card:#15171E;--card2:#1D2029;--fill:rgba(255,255,255,.06);--fill2:rgba(255,255,255,.12);
  --ink:#F2F3F7;--mut:#9AA0B2;--faint:#5A6072;--line:#242733;
  --acc:#7C5CFF;--acc-s:rgba(124,92,255,.18);--on-acc:#FFFFFF;--g1:#7C5CFF;--g2:#36C2FF;--coral:#FF6B86;--coral-s:rgba(255,107,134,.16);
  --blue:#7C5CFF;--blue-s:rgba(124,92,255,.16);--orange:#FF9A4D;--orange-s:rgba(255,154,77,.16);--mint:#3ED88A;--mint-s:rgba(62,216,138,.14);
  --red:#FF6B70;--red-s:rgba(255,107,112,.16);--pink:#FF6B86;--cyan:#3ED88A;--indigo:#7C5CFF;--purple:#7C5CFF;
  --on-blue:#FFFFFF;--shadow:none;--glass:rgba(11,12,16,.92);--tabink:#8A90A0;--tabon:#9D86FF;color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);min-height:100%}
body{min-height:100vh;min-height:100dvh}
@media (display-mode:standalone){main{padding-top:4px}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss01"}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;transition:transform .12s ease,opacity .12s ease,background-color .2s ease}
button:active:not(:disabled){transform:scale(.97)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
main{max-width:600px;margin:0 auto;padding:10px 16px 170px}
h1,h2,h3{margin:0;font-family:var(--fc);letter-spacing:.01em;line-height:1.02;text-transform:uppercase}
p{margin:0}
.muted{color:var(--mut)}
.small{font-size:13px;line-height:1.38}
.num{font-family:var(--fr);font-variant-numeric:tabular-nums}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--mut)}
.splash b{display:block;font:800 40px/1 var(--fc);letter-spacing:-.03em;color:var(--ink);margin-bottom:8px}

/* ---------- large-title header ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:10px 4px 12px}
.eyebrow{font-size:12px;color:var(--acc)!important;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.hero h1{font-size:44px;font-weight:800;letter-spacing:.01em;line-height:.95}
.hero .sub{color:var(--mut);margin-top:3px;font-size:14px}
.hero-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font:700 18px var(--fr);color:var(--ink);background:var(--card)}
.count{text-align:right}
.count b{display:block;font:800 40px/1 var(--fr);color:var(--acc);font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--mut);font-weight:500}
.pill-tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 11px;border-radius:999px;background:var(--orange-s);color:var(--orange);font-size:13px;font-weight:600}
.sync{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--mut)}
.sync[hidden]{display:none}
.sync.offline{color:var(--orange)}

/* ---------- week strip with mini rings ---------- */
.strip{display:grid;grid-template-columns:24px repeat(7,1fr) 24px;gap:2px;align-items:center;margin:0 0 16px}
.strip-arrow{border:0;background:none;color:var(--faint);font-size:24px;height:56px;padding:0}
.sd{border:0;background:none;border-radius:16px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;position:relative}
.sd-w{font-size:11px;font-weight:600;color:var(--mut)}
.sd .mr{width:38px;height:38px;position:relative;display:grid;place-items:center}
.sd .mr svg{position:absolute;inset:0;transform:rotate(-90deg)}
.sd .mr circle{fill:none;stroke-width:3.5}
.sd .mr .t{stroke:var(--fill)}
.sd .mr .a{stroke:var(--mint);stroke-linecap:round}
.sd.st-miss .mr .a{stroke:var(--red)}
.sd.st-off .mr .t{stroke:var(--fill2);stroke-dasharray:2 3}
.sd-n{font:600 15px/1 var(--fr);position:relative}
.sd.today .sd-n{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
.sd.on .mr::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--acc)}
.sd.on .sd-n{color:var(--on-acc)}
.sd i{display:none}
.sd-f{font:700 9.5px/1 var(--fc);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd.on .sd-f{color:var(--ink)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.card h2{font-size:22px;font-weight:700}
.card .lead{color:var(--mut);margin-top:3px;font-size:14px}
.sec{font:700 14px/1 var(--fc);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 4px 8px;padding-left:10px;border-left:3px solid var(--acc)}
.flash{border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.flash.good{background:var(--mint-s)}.flash.warn{background:var(--orange-s)}.flash.info{background:var(--blue-s)}.flash.off{background:var(--card);box-shadow:var(--shadow)}
.flash b{display:block;font:600 15px/1.25 var(--fc);margin-bottom:2px}
.flash ul{margin:6px 0 0;padding-left:18px}
.flash li{margin:3px 0}
.weekcard{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,#3A3A3C 0%,#1C1C1E 55%,#000 100%);color:#fff;border-radius:24px;padding:20px;margin-bottom:12px}
.weekcard::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,149,0,.35),transparent 70%)}
.weekcard .kb{display:inline-block;font:600 12px/1 var(--f);letter-spacing:.03em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(255,149,0,.2);color:#FFB340;margin-bottom:10px}
.weekcard h2{font-size:24px;font-weight:700;position:relative}
.weekcard p{margin-top:6px;color:rgba(255,255,255,.72);font-size:14px;position:relative}
.weekcard .btn{margin-top:14px;background:rgba(255,255,255,.14);color:#fff;position:relative}

/* ---------- activity rings ---------- */
.rings{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.rings svg{width:84px;height:84px;transform:rotate(-90deg)}
.rings circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring-leg{display:grid;gap:3px}
.ring-leg div{line-height:1.2}
.ring-leg span{display:inline;font-size:12px;font-weight:600;margin-right:6px}
.ring-leg b{font:700 15px var(--fr);font-variant-numeric:tabular-nums}
.ring-leg small{font:500 13px var(--f);color:var(--mut)}
.c-pink{color:var(--pink)}.c-mint{color:var(--mint)}.c-cyan{color:var(--cyan)}.c-orange{color:var(--orange)}.c-blue{color:var(--blue)}

/* ---------- sessions ---------- */
.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sess.dim{opacity:.55}
.sess-h{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:14px 16px 0}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--on-acc);background:var(--acc)!important}
.tile svg{width:22px;height:22px;fill:none;stroke:var(--on-acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl-run{background:linear-gradient(145deg,#5AC8FA,#007AFF)}.tl-strength{background:linear-gradient(145deg,#BF5AF2,#5856D6)}.tl-hyrox{background:linear-gradient(145deg,#FFB340,#FF2D55)}.tl-mobility,.tl-skill{background:linear-gradient(145deg,#63E6BE,#30B0C7)}.tl-food{background:linear-gradient(145deg,#A8E063,#34C759)}
.sess-h h2{font-size:24px;font-weight:700}
.meta{font-size:12.5px;color:var(--mut);margin-top:2px}
.meta .k{color:var(--ink);font-weight:700;background:var(--acc-s);padding:1px 6px;border-radius:4px}
.sess-b{padding:10px 16px 2px}
.sess-a{display:flex;gap:8px;padding:10px 16px 14px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.b-done{background:var(--mint-s);color:var(--mint)}.b-missed{background:var(--red-s);color:var(--red)}
.b-moved,.b-dropped,.b-excused{background:var(--fill);color:var(--mut)}
.lines{margin:0;padding:0;list-style:none}
.lines li{padding:5px 0;font-size:14px}
.lines li+li{border-top:.5px solid var(--line)}
.exl{margin:0;padding:0;list-style:none}
.exl li{display:grid;grid-template-columns:66px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-top:.5px solid var(--line);font-size:14px}
.pic-b{position:relative;border:1px solid var(--line);background:var(--card2);border-radius:10px;width:66px;height:38px;padding:4px;display:grid;place-items:center}
.pic{width:56px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85;color:var(--ink)}
.pic2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 4px}
.pic2 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.pic2 svg{width:100%;max-width:150px;height:auto;fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--ink)}
.pic2 span{display:block;font:700 12px/1 var(--fc);text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-top:6px}
.pic-b .grp{position:absolute;right:-4px;top:-4px;margin:0}
.pic-lg{width:120px;height:120px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:4px auto 0;opacity:.85}
.exl .nm{display:inline;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;letter-spacing:inherit;line-height:inherit}
.exl .nm::after{content:""}
.exl .cue{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.exl li:first-child{border-top:0}
.exl .tg{font:600 14px/1 var(--fr);color:var(--mut);font-variant-numeric:tabular-nums}
.exl .ld{border:0;background:none;padding:0;font:600 14px/1 var(--fr);min-width:0;text-align:right;font-variant-numeric:tabular-nums}
.exl .ld.sg{color:var(--faint);font-weight:500}
.exl .grp{font:700 11px/1 var(--f);font-style:normal;color:var(--on-acc);background:var(--acc);border-radius:6px;padding:3px 5px;margin-right:7px;vertical-align:1px}
.exl .sw{border:0;background:var(--fill);color:var(--mut);border-radius:10px;width:30px;height:28px;font-size:14px;padding:0}
.exl .dn{grid-column:1/-1;font-size:13px;color:var(--mut);margin-top:-2px}
.wc{margin-top:10px;display:grid;gap:6px}
.wc-t{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 0 0;font:500 13px var(--f);color:var(--mut)}
.wc-t i{font-style:normal;color:var(--faint)}
.wc div{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:12.5px;color:var(--mut);line-height:1.35}
.wc svg{width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.wc b{color:var(--ink);font-weight:600}
.chipline{display:inline-block;margin-right:6px;font:600 12px/1 var(--f);padding:4px 8px;border-radius:8px}
.tr-up{background:var(--mint-s);color:var(--mint)}.tr-down,.tr-reset{background:var(--orange-s);color:var(--orange)}.tr-hold{background:var(--fill);color:var(--mut)}
.fb{margin-top:8px;font-size:14px;padding:10px 12px;border-radius:14px}
.fb.good{background:var(--mint-s)}.fb.warn{background:var(--orange-s)}.fb.info{background:var(--fill)}
.textb{font-size:14px}
.ask{box-shadow:0 0 0 1.5px var(--blue) inset,var(--shadow)}
.mc-l{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 6px}
.sess.c{display:grid;grid-template-columns:40px 1fr auto 14px;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.sess.c .sc-t{min-width:0}
.sess.c b{display:block;font:700 20px/1.05 var(--fc);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess.c span{display:block;font-size:12.5px;color:var(--mut);margin-top:1px}
.sess.c .chev{color:var(--faint);font-style:normal;font-size:20px}
.sess.c .btn.small{min-height:32px;padding:6px 12px}
.row-c{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);text-align:left;background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:10px}
.row-c .tile,.row-h .tile{width:34px;height:34px;border-radius:9px}
.row-c .tile svg,.row-h .tile svg{width:18px;height:18px}
.row-c b,.row-h b{display:block;font-weight:600;font-size:14.5px}
.row-c span,.row-h span{display:block;font-size:12.5px;color:var(--mut)}
.row-c i{margin-left:auto;color:var(--faint);font-style:normal;font-size:20px}
.row-h{display:flex;align-items:center;gap:12px}
.card.slim{padding:12px 14px}
.tipline{font-size:13.5px;color:var(--ink);margin-top:10px;line-height:1.45}
.srow{display:flex;align-items:center;gap:12px;padding:4px 6px 12px}
.sring{width:44px;height:44px;transform:rotate(-90deg);flex-shrink:0}
.sring circle{fill:none;stroke-linecap:round}
.srow b{display:block;font:700 22px/1 var(--fc);text-transform:uppercase}
.srow span{display:block;font-size:12.5px;color:var(--mut)}
.focus{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px 16px 16px;margin-bottom:10px}
.focus h2{font-size:44px;font-weight:800;line-height:.95;margin-top:2px}
.focus .fm{font:700 13px/1.2 var(--fc);text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-top:8px}
.focus .fs{font-size:13px;color:var(--mut);margin-top:6px}
.mmap{height:auto;display:block}
.mmap rect,.mmap circle{fill:var(--fill2)}
.mmap .sk rect,.mmap .sk circle,.mmap rect.sk,.mmap circle.sk{fill:var(--fill)}
.mmap .hi rect,.mmap .hi circle{fill:var(--acc)}
.mmap .md rect,.mmap .md circle{fill:var(--acc);opacity:.45}
.sticky{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.sticky .btn{pointer-events:auto;width:100%;max-width:568px;min-height:54px;font:800 20px/1 var(--fc);text-transform:uppercase;letter-spacing:.04em;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.exg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.exc{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;display:grid;gap:4px}
.exc b{font:700 16px/1.05 var(--fc);text-transform:uppercase;letter-spacing:.01em;min-height:2.1em}
.exc .exv{font:800 22px/1 var(--fr);font-variant-numeric:tabular-nums}
.exc .exv small{font:500 11px var(--f);color:var(--mut)}
.spark{width:100%;height:36px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--acc);stroke:none}
.exc .exd{font-size:11.5px;color:var(--mut)}
.exc .exd.up{color:var(--mint)}.exc .exd.dn{color:var(--red)}
.dc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.dc button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 8px;text-align:left;min-width:0}
.dc button small{display:block;font:700 10.5px/1 var(--fc);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.dc button b{display:block;font:600 13.5px/1.2 var(--f);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc button.need{border-color:var(--acc);background:var(--acc-s)}
.banner{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.banner b{display:block;font:700 18px/1 var(--fc);text-transform:uppercase;color:var(--acc)}
.banner span{display:block;font-size:13px;opacity:.85;margin-top:3px}
.banner .btn{margin-left:auto;background:var(--acc);color:var(--on-acc);min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.tools-t{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:4px 0 0}
.tools-t .btn{font-size:13px;padding:8px 10px;min-height:36px}
.wk{display:grid;gap:4px;margin-top:10px}
.wk-r{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;padding:3px 0}
.wk-r.cur .wd{color:var(--blue)}
.wd{font:600 12px var(--fr);color:var(--mut);text-align:center}
.wd small{display:block;font:500 11px var(--fr);color:var(--faint)}
.wk-cs{display:flex;flex-wrap:wrap;gap:4px}
.wk-c{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--mut)}
.wk-c.done{background:var(--mint-s);color:var(--mint)}.wk-c.miss{background:var(--red-s);color:var(--red)}.wk-c.now{background:var(--blue-s);color:var(--blue)}.wk-c.off{opacity:.6}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tools .btn{flex:1 1 30%;min-height:38px;font-size:13px;padding:8px 10px}
.mini{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.mini b{display:block;font-weight:600;font-size:14px}
.mini span{display:block;font-size:12.5px;color:var(--mut)}
.mini i{margin-left:auto;color:var(--faint);font-style:normal;font-size:18px}
.cues{margin:12px 0 0;padding:0;list-style:none}
.cues li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:9px 0;border-top:.5px solid var(--line);font-size:14.5px;line-height:1.4}
.cues li:first-child{border-top:0}
.cues li b{font:700 13px var(--fr);color:var(--on-acc);background:var(--acc);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.watch{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--acc);color:var(--on-acc);border-radius:13px;padding:12px 16px;font-weight:600;font-size:15px;margin-top:14px}
.watch svg{width:18px;height:18px;fill:var(--on-acc)}
.hw{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:.5px solid var(--line);font-size:14px}
.hw:first-child{border-top:0}
.hw small{display:block;color:var(--mut);font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--fill);border-radius:12px;padding:10px 12px}
.kv b{display:block;font:700 18px var(--fr);font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--mut)}
.steps{margin:12px 0 0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:.5px solid var(--line);font-size:14.5px;line-height:1.45}
.steps li::before{content:counter(s);font:700 13px var(--fr);color:var(--on-acc);background:var(--acc);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:1px}
.steps li:first-child{border-top:0}
.copyrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.copyrow .in{font:500 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px;word-break:break-all}
.daymin{font-size:13px;color:var(--mut);margin:-2px 4px 10px}
.daymin b{color:var(--ink);font-weight:600}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:13px;padding:11px 16px;font-weight:600;font-size:15px;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn.text{background:none;color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px;padding:12px 8px}
.btn.warn,.btn.text.warn{color:var(--red)}
.btn.small{min-height:34px;padding:7px 12px;font-size:13px;border-radius:11px}
.btn.xl{width:100%;min-height:56px;font-size:18px;border-radius:16px}
.btn:disabled{opacity:.35;cursor:default}
.sess-a .btn.primary{flex:1 1 130px}

/* ---------- controls ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--acc);color:var(--on-acc)}
.chip.sm{padding:6px 12px;font-size:13px}
.chips.col{flex-direction:column;align-items:stretch;gap:8px;margin-top:6px}
.chip.big{padding:15px 18px;font-size:17px;font-weight:600;border-radius:16px;text-align:left;background:var(--card);box-shadow:var(--shadow)}
.chip.big.on{background:var(--ink);color:var(--bg)}
.chip.off{opacity:.45;text-decoration:line-through}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe .chip{padding:10px 0;text-align:center;font:600 16px/1 var(--fr);border-radius:10px}
.fld{display:block;margin-top:14px}
.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:500}
.in{width:100%;border:0;background:var(--fill);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 40%,transparent)}
textarea.in{min-height:78px;resize:vertical;font-size:16px}
select.in{padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row2>*,.row3>*{min-width:0}
input[type="date"].in{min-width:0;max-width:100%;display:block}
.qrow{margin-top:14px}
.qrow>span{display:block;font-size:14px;color:var(--mut);margin-bottom:8px}
.help{font-size:13px;color:var(--mut);margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--blue);flex-shrink:0}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:1em}

/* ---------- grouped lists ---------- */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:.5px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:600}
.list .t span{display:block;font-size:13px;color:var(--mut)}
.list .v{font:600 17px/1 var(--fr);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.list .v small{display:block;font:500 12px var(--f);color:var(--mut);margin-top:3px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--faint)}
.d-run{background:var(--blue)}.d-strength{background:var(--purple)}.d-hyrox{background:var(--orange)}.d-mobility,.d-skill{background:var(--mint)}.d-off{background:var(--faint)}
.rank{font:700 20px/1 var(--fr);width:24px;text-align:center;color:var(--faint)}
.me .rank{color:var(--blue)}
.tip-c{border-radius:16px;padding:13px 15px;margin-top:10px;background:var(--fill)}
.tip-c b{display:block;font:600 15px/1.25 var(--fc);margin-bottom:3px}
.tip-c.warn{background:var(--orange-s)}.tip-c.good{background:var(--mint-s)}.tip-c.info{background:var(--blue-s)}
.tip-c p{font-size:13.5px}
.link{border:0;background:none;color:var(--blue);font-weight:600;padding:12px 0 0;font-size:15px}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:92px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:8px;border-radius:8px;background:var(--fill);position:relative}
.bar i b{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--mint)}
.bar i b.low{background:var(--orange)}
.bar i em{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink);opacity:.45}
.bar.gb{grid-template-columns:104px 1fr auto}
.bar.gb span:last-child{white-space:nowrap;min-width:64px}
.bar span:last-child{font:600 14px var(--fr);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- week view ---------- */
.wnav{display:flex;gap:8px;margin:-4px 0 12px}
.wnav .btn{flex:1}
.pday{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;display:block}
.pday.today{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.pday h3{font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pday h3 small{font:500 13px var(--f);color:var(--blue);white-space:nowrap;margin-left:10px}
.pday h3 small.muted{color:var(--mut)}
.pday ul{list-style:none;margin:6px 0 0;padding:0}
.pday li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.pday li .t{flex:1;min-width:0}
.pday li .badge{font-size:11px;padding:3px 8px}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tiles .tile{width:auto;height:auto;display:block;background:var(--card)!important;border:1px solid var(--line);border-radius:14px;padding:14px 12px;color:var(--ink)}
.tiles .tile b{display:block;font:800 34px/1 var(--fr);font-variant-numeric:tabular-nums}
.tiles .tile span{font-size:12px;color:var(--mut);font-weight:500}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--mut);font:11px var(--f)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- tab bar (frosted) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0A0A0B;border-top:1px solid #242428;display:flex;justify-content:center;padding:6px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs .in-t{display:flex;width:100%;max-width:600px}
.tabs button{flex:1;border:0;background:none;color:var(--tabink);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.01em;padding:4px 0;min-height:50px}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--tabon)}
.tabs button.on svg{stroke-width:2.2}
.tabs[hidden]{display:none}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.scrim[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;border-top:3px solid var(--acc);padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.9,.25,1)}
.sheet.still{animation:none}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.sheet-h h2{font-size:28px;font-weight:700}
.icon{border:0;background:var(--fill);border-radius:50%;width:32px;height:32px;font-size:14px;flex-shrink:0;display:grid;place-items:center;color:var(--mut)}
.pace-out{font:700 30px/1 var(--fr)}
.pace-out small{font:500 14px var(--f);color:var(--mut)}
.opts{background:var(--card);border-radius:18px;overflow:hidden;margin-top:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:13px 16px;border-top:.5px solid var(--line);font-size:16px}
.opt:first-child{border-top:0}
.opt .t{flex:1;min-width:0}
.opt .t small{display:block;font-size:13px;color:var(--mut)}
.opt .tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--mint-s);color:var(--mint);white-space:nowrap}
.opt .tag.cur{background:var(--fill);color:var(--mut)}
.opt .tag.hard{background:var(--orange-s);color:var(--orange)}

/* ---------- workout ---------- */
.wo{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wo[hidden]{display:none}
.wo-in{max-width:600px;margin:0 auto;padding:12px 16px 30px}
.wo-top{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center}
.wo-title{text-align:center;line-height:1.2}
.wo-title b{display:block;font:600 17px var(--fc)}
.wo-title span{font-size:13px;color:var(--mut)}
.wo-rail{display:flex;gap:5px;margin:14px 0 18px}
.rail{flex:1;height:5px;border-radius:5px;border:0;background:var(--fill);padding:0}
.rail.done{background:var(--mint)}.rail.on{background:var(--acc)}
.wo-ex{font-size:40px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wo-ex .how{font:600 12px var(--f);letter-spacing:0;color:var(--blue);background:var(--blue-s);border:0;border-radius:999px;padding:5px 10px}
.wo-target{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.wo-target .num{font:700 50px/.95 var(--fr);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wo-target .at{font:600 22px/1 var(--fr);color:var(--mut)}
.wo-target .at em{font-style:normal;color:var(--ink)}
.wo-last{color:var(--mut);font-size:14px;margin-top:8px}
.wo-note{color:var(--mut);font-size:14px;margin-top:6px}
.wo-note b{color:var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.pill{border:0;background:var(--fill);border-radius:12px;padding:9px 13px;font:600 15px/1 var(--fr);color:var(--mut)}
.pill.cur{background:var(--acc);color:var(--on-acc)}
.pill.done{background:var(--mint-s);color:var(--mint)}
.pill.done.ed{box-shadow:0 0 0 2px var(--blue)}
.tip{margin-top:10px;font-size:15px;background:var(--blue-s);border-radius:14px;padding:11px 13px}
.quick{display:grid;grid-template-columns:34px repeat(auto-fit,minmax(44px,1fr));gap:6px;align-items:center;margin-top:10px}
.quick span{font:700 11px var(--fc);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.qk{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 0;font:700 16px var(--fr);color:var(--ink);font-variant-numeric:tabular-nums}
.qk.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.steppers{display:grid;gap:10px;margin-top:12px}
.steppers.two{grid-template-columns:1fr 1fr}
.stp{background:var(--card);border-radius:22px;padding:10px 10px 12px;box-shadow:var(--shadow);text-align:center}
.stp-l{font-size:13px;color:var(--mut);font-weight:500}
.stp-c{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px;margin-top:2px}
.stp-c button{border:0;background:var(--fill);border-radius:50%;width:44px;height:44px;font-size:24px;line-height:1}
.stp-c input{width:100%;border:0;background:none;text-align:center;font:700 44px/1 var(--fr);padding:0;outline:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.stp-c input::-webkit-outer-spin-button,.stp-c input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qk{display:grid;grid-template-columns:52px repeat(4,1fr);gap:6px;margin-top:8px;align-items:center}
.qk span{font:700 11px/1 var(--fc);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.qk button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 0;font:700 15px var(--fr)}
.effort{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 14px}
.effort .chip{padding:11px 0;text-align:center}
.effort .chip.on[data-v="fail"]{background:var(--red);color:#fff}
.wo-foot{display:flex;justify-content:space-between;margin-top:6px}
.rest{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:#1C1C1E;color:#fff;border-radius:24px;padding:14px 16px;margin-bottom:16px}
.rest[hidden]{display:none}
.rest svg{width:86px;height:86px;transform:rotate(-90deg)}
.rest circle{fill:none;stroke-width:8}
.rest .trk{stroke:rgba(255,255,255,.14)}
.rest .arc{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest b{display:block;font:700 44px/1 var(--fr);font-variant-numeric:tabular-nums}
.rest span{font-size:14px;opacity:.75}
.rest-a{grid-column:1/-1;display:flex;gap:8px}
.rest-a button{flex:1;border:0;border-radius:12px;padding:11px;background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.rest.go .arc{stroke:var(--mint)}
.ticks{display:grid;gap:8px;margin-top:12px}
.tick{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left;font-size:14px}
.tick .q{margin-left:auto;border:0;background:var(--fill);color:var(--mut);border-radius:50%;width:26px;height:26px;font:600 13px var(--f);flex-shrink:0}
.tick.on .q{opacity:.5}
.tick i{width:24px;height:24px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 2px var(--faint);display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.tick.on i{background:var(--mint);box-shadow:none}
.tick.on{color:var(--mut)}
.sumrow{padding:12px 0;border-top:.5px solid var(--line)}
.sumrow:first-child{border-top:0}
.sumrow b{font-weight:600}
.sumrow p{font-size:14px;color:var(--mut);margin-top:2px}

/* ---------- food ---------- */
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.macro b{font:700 17px var(--fr);font-variant-numeric:tabular-nums}
.macro i{display:block;height:6px;border-radius:6px;background:var(--fill);margin-top:6px;overflow:hidden}
.macro i em{display:block;height:100%;border-radius:6px}
.meal{background:var(--card);border-radius:20px;padding:6px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.meal-h{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px}
.meal-h b{font-size:17px;font-weight:700;letter-spacing:-.015em}
.meal-h span{font:600 15px var(--fr);color:var(--mut)}
.fitem{display:grid;grid-template-columns:1fr auto 30px;gap:10px;align-items:center;padding:10px 0;border-top:.5px solid var(--line);font-size:15px}
.fitem small{display:block;color:var(--mut);font-size:12px}
.fitem .k{font:600 15px var(--fr);font-variant-numeric:tabular-nums}
.fitem button{border:0;background:var(--fill);border-radius:50%;width:26px;height:26px;color:var(--mut);font-size:12px;padding:0}
.addrow{display:block;width:100%;border:0;background:none;color:var(--blue);font-weight:600;text-align:left;padding:12px 0;border-top:.5px solid var(--line);font-size:15px}
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.water button{width:34px;height:42px;border:0;border-radius:10px;background:var(--fill);padding:0;position:relative;overflow:hidden}
.water button.on{background:linear-gradient(180deg,#64D2FF,#0A84FF)}

/* ---------- sign in & setup ---------- */
.gate{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center}
.brand{font:800 76px/.88 var(--fc);letter-spacing:.01em;text-transform:uppercase}
.brand span{display:block;color:var(--acc)}
.gate .lead{color:var(--mut);margin:16px 0 24px;font-size:17px;max-width:32ch}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:12px;padding:3px;gap:3px;margin-bottom:6px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;font-size:15px;color:var(--ink)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.setup h1{font-size:40px;font-weight:800;line-height:.98;margin-top:12px}
.setup.flow{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.dots{display:flex;gap:6px;margin:6px 0 14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--fill2)}
.dots i.on{background:var(--acc);width:22px;border-radius:4px}
.dots i.d{background:var(--acc);opacity:.45}
.flow-a{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:18px;align-items:center}
.flow-a .btn.ghost{min-height:56px;border-radius:16px}
.flow .step{margin-top:6px}
.setup .lead{color:var(--mut);margin-top:8px;font-size:17px;max-width:38ch}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.step h2{font-size:19px;font-weight:700;display:flex;gap:10px;align-items:center}
.step h2 i{font:700 13px/1 var(--fr);font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--on-acc)}
.preview{margin-top:10px;font-size:14px;color:var(--mut)}
.preview b{color:var(--ink);font:600 16px var(--fr)}
.liftgrid{display:grid;grid-template-columns:1fr 96px;gap:8px 12px;align-items:center;margin-top:10px}
.liftgrid label{font-size:15px}
.liftgrid .in{padding:10px 12px;text-align:right}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:70;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 30px rgba(0,0,0,.18);text-align:center}
.toast.show{opacity:1;pointer-events:auto}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
@media (max-width:360px){.hero h1{font-size:30px}.wo-target .num{font-size:48px}.brand{font-size:50px}.rings{grid-template-columns:112px 1fr}.rings svg{width:112px;height:112px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- v14 components: the A + B + D layout ---------- */
h1,h2,h3{text-transform:none;letter-spacing:-.02em;line-height:1.1}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.eyebrow{color:var(--mut)!important;text-transform:none;letter-spacing:0;font-weight:500}
.count b{font-size:28px;color:var(--coral)}
.avatar{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:700}
.card{border:0;border-radius:22px;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:700;text-transform:none}
.sess{border:0;border-radius:22px;box-shadow:var(--shadow)}
.sess-h h2{font-size:18px;text-transform:none}
.sess.c b{font:700 15.5px/1.2 var(--f);text-transform:none;letter-spacing:-.01em}
.tile{background:var(--acc-s)!important;color:var(--acc);border-radius:14px}
.tile svg{stroke:var(--acc)}
.tl-run{background:rgba(54,194,255,.16)!important;color:#1D9BD6}.tl-run svg{stroke:#1D9BD6}
.tl-hyrox{background:var(--coral-s)!important;color:var(--coral)}.tl-hyrox svg{stroke:var(--coral)}
.tl-mobility,.tl-skill{background:var(--mint-s)!important;color:var(--mint)}.tl-mobility svg,.tl-skill svg{stroke:var(--mint)}
.btn.primary{background:var(--acc);color:#fff;border-radius:16px}
.btn.text{text-decoration:none;color:var(--acc)}
.chip.on{background:var(--ink);color:var(--bg)}
.sec{border-left:0;padding-left:4px;text-transform:none;letter-spacing:-.01em;font:700 15px var(--f);color:var(--ink);margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.sec a,.sec button{font:600 13px var(--f);color:var(--acc);background:none;border:0;padding:0}
.tabs{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--line)}
.tabs svg{stroke-width:1.9}
.sheet{border-top:0;border-radius:28px 28px 0 0}
.sheet-h h2{text-transform:none;font-size:22px}
.meta .k{background:var(--coral-s);color:var(--coral)}
.srow b{text-transform:none;font:700 16px var(--f)}
.focus{display:none}
.sd .mr .a{stroke:var(--acc)}
.sd.on .mr::before{background:var(--ink)}
.sd.on .sd-n{color:var(--bg)}
.sd-f{text-transform:none;letter-spacing:0;font:600 10px var(--f)}
/* greeting, streak, coach bubble */
.hi{display:flex;justify-content:space-between;align-items:center;margin:8px 4px 12px}
.hi h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.hi .streak{background:#FFF3D6;color:#B86E00;font:700 12px var(--f);padding:7px 11px;border-radius:999px;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hi .streak{background:rgba(255,179,64,.16);color:#FFB340}}
.coach{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.coach .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));flex-shrink:0;display:grid;place-items:center}
.coach .av svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bub{flex:1;background:var(--card2);border-radius:18px 18px 18px 4px;padding:12px 14px;font:500 14px/1.45 var(--f)}
.bub b{font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px 50px}
.quick button{border:1.5px solid var(--line);background:var(--card);font:600 12.5px var(--f);padding:7px 12px;border-radius:999px;color:var(--ink)}
.quick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* week bar */
.wkbar{display:flex;gap:6px;margin:0 0 14px}
.wkbar button{flex:1;border:0;background:none;padding:0;text-align:center}
.wkbar small{display:block;font:600 11px var(--f);color:var(--mut)}
.wkbar em{display:block;font:600 9.5px var(--f);font-style:normal;color:var(--faint);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wkbar i{display:block;height:6px;border-radius:6px;background:var(--line);margin-top:6px}
.wkbar i.d{background:var(--mint)}.wkbar i.m{background:var(--red)}.wkbar i.t{background:var(--acc)}.wkbar i.o{background:var(--fill2)}

.hero2{border-radius:24px;padding:18px 18px 16px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;margin-bottom:12px;position:relative;overflow:hidden}
.hero2 small{font:700 11px var(--f);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero2 h2{font:800 32px/1 var(--f);letter-spacing:-.03em;margin-top:6px;color:#fff;text-transform:none}
.hero2 p{font:500 13px/1.4 var(--f);opacity:.92;margin-top:8px}
.hero2 .st{display:flex;gap:6px;margin-top:14px}

.hero2 .st b{display:block;font:800 17px var(--f)}
.hero2 .go{margin-top:14px;display:block;width:100%;border:0;background:#fff;color:var(--acc);font:800 15px var(--f);padding:14px;border-radius:14px}
.hero2.done{background:linear-gradient(135deg,#1FB46B,#36C2FF)}

.days::-webkit-scrollbar{display:none}
.days button{min-width:118px;height:96px;border:0;border-radius:16px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;color:#fff;text-align:left;flex-shrink:0}
.days small{font:700 10px var(--f);letter-spacing:.12em;text-transform:uppercase;opacity:.85}

.rec{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.rec .mm{display:flex;gap:4px;flex-shrink:0}.rec .mm i{width:18px;height:30px;border-radius:5px;background:var(--line)}

.exl{display:grid;gap:8px}
.exl li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px;border:0;background:var(--card2);border-radius:18px}
.exl li:first-child{border-top:0}
.pic-b{width:62px;height:52px;border:0;background:var(--acc-s);border-radius:14px;color:var(--acc)}
.pic{stroke:var(--acc);opacity:1;width:54px;height:30px}
.pic-b .grp{position:absolute;right:-4px;top:-4px}
.exl .nm{font:700 14.5px var(--f)}
.exl .sub{display:block;font:500 12px var(--f);color:var(--mut)}
.exl .tg{font:700 14.5px var(--f);text-align:right}
.exl .ld{display:block;font:500 12px var(--f);color:var(--mut);text-align:right;min-width:0;margin-top:2px}
.exl .cue{color:var(--acc)}
.addx{display:block;width:100%;border:1.5px dashed var(--line);background:none;border-radius:16px;padding:12px;font:600 13.5px var(--f);color:var(--acc);margin-top:8px}
/* proof tiles */
.proof{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.proof div{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);font:600 12px var(--f);color:var(--mut)}
.proof b{display:block;font:800 20px var(--f);color:var(--ink);letter-spacing:-.02em}
.sticky .btn{text-transform:none;font:800 17px var(--f);letter-spacing:-.01em;background:var(--acc);color:#fff}
.toast{display:flex;align-items:center;gap:12px}
.tact{border:0;background:var(--acc);color:#fff;font:700 13px var(--f);padding:7px 12px;border-radius:999px}
.xsets{display:grid;gap:6px;margin-top:10px}.xsets div{display:grid;grid-template-columns:50px 1fr 1fr;gap:6px;align-items:center;font:600 12px var(--f);color:var(--mut)}
.xsets .in{padding:9px 10px;font-size:16px}
/* zoom and notch */
html{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
button{touch-action:manipulation}
.dc{display:none}
